name: Build Odin Kernel (FinaSU + SUSFS, WiFi Fix)

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: FinaSU tag/branch
        default: v1.5.0
        type: string
      kernel_repo:
        description: Kernel source repo
        default: orangetect/odin-kernel-finaisu
        type: string
      kernel_ref:
        description: Kernel branch
        default: main
        type: string
      disable_preinit:
        description: Disable KSU preinit
        default: false
        type: boolean
      disable_susfs:
        description: Disable SUSFS
        default: false
        type: boolean
      embed_ksud:
        description: Embed ksud into AK3 zip
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KERNEL_NAME: Odin-FinaSU-SUSFS
      DEVICE: odin
      DEFCONFIG: odin_defconfig
      CLANG_BRANCH: 14.0.6
      CLANG_REPO: ZyCromerZ/Clang

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Cleanup disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git ccache make build-essential libssl-dev bison flex libelf-dev bc cpio unzip wget curl python3 python3-pip
          pip3 install --upgrade requests

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.DEVICE }}-clang${{ env.CLANG_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.DEVICE }}-clang${{ env.CLANG_BRANCH }}-

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_ref }} https://github.com/${{ inputs.kernel_repo }} kernel
          cd kernel
          git config --global user.name "CI"
          git config --global user.email "ci@ci.local"

      - name: Download Clang ${{ env.CLANG_BRANCH }}
        run: |
          git clone --depth=1 -b ${{ env.CLANG_BRANCH }} https://github.com/${{ env.CLANG_REPO }} clang
          cd clang
          bash get.sh
          cd ..
          echo "PATH=${{ github.workspace }}/clang/bin:${PATH}" >> $GITHUB_ENV

      - name: Prepare defconfig (PURE ODIN ONLY, NO VENUS COPY)
        run: |
          cd kernel
          if [ ! -f arch/arm64/configs/${{ env.DEFCONFIG }} ]; then
            echo "ERROR: Missing arch/arm64/configs/${{ env.DEFCONFIG }} in kernel source!"
            exit 1
          fi
          make O=out ${{ env.DEFCONFIG }} LLVM=1 LLVM_IAS=1
          # 不再自动合并venus、不再清理venus宏，基准就是原生odin配置
          echo "Using pure odin_defconfig, venus migration logic removed"

      - name: Apply FinaSU & SUSFS patches
        run: |
          cd kernel
          KSU_REF=${{ inputs.ksu_ref }}
          DISABLE_SUSFS=${{ inputs.disable_susfs }}
          DISABLE_PREINIT=${{ inputs.disable_preinit }}

          rm -rf KernelSU
          git clone --depth=1 -b ${KSU_REF} https://github.com/5ec1cff/FinaSU KernelSU

          # SUSFS集成脚本，移除proc/version/utsname字符串篡改（WiFi HAL fix）
          if [ "${DISABLE_SUSFS}" = "false" ]; then
            bash KernelSU/scripts/susfs-preinit.sh
            # 【关键修改】注释掉 uname / proc version 伪装补丁，只保留挂载隐藏
            sed -i '/utsname_str/d' KernelSU/scripts/susfs-preinit.sh || true
            sed -i '/proc_version/d' KernelSU/scripts/susfs-preinit.sh || true
          fi

          # KSU config injection
          if [ "${DISABLE_PREINIT}" = "true" ]; then
            echo "CONFIG_KSU=n" >> out/.config
            echo "CONFIG_KSU_PREINIT=n" >> out/.config
          else
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KSU_SECOND_SIGNATURE_RELEASE=1" >> out/.config
            if [ "${DISABLE_SUSFS}" = "false" ]; then
              echo "CONFIG_SUSFS=y" >> out/.config
              echo "CONFIG_SUSFS_SYSFS_HIDE=y" >> out/.config
              echo "CONFIG_SUSFS_MOUNT_HIDE=y" >> out/.config
            else
              echo "CONFIG_SUSFS=n" >> out/.config
            fi
          fi

          # 【重点】删除原脚本里的调度/input-boost/io-is-busy/pelt补丁块，这里完全不打
          make O=out olddefconfig LLVM=1 LLVM_IAS=1

      - name: Pre-build quick check
        run: |
          cd kernel
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 scripts prepare
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Build kernel
        run: |
          cd kernel
          export KBUILD_BUILD_VERSION="${{ env.KERNEL_NAME }}-$(date +%Y%m%d)-${{ github.run_number }}"
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 Image.gz dtbs
          cp out/arch/arm64/boot/Image.gz ${{ github.workspace }}/
          cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb ${{ github.workspace }}/dtbs/ || mkdir -p ${{ github.workspace }}/dtbs
          cp out/.config ${{ github.workspace }}/build.config

      - name: Generate sha256sum
        run: |
          cd ${{ github.workspace }}
          sha256sum Image.gz build.config > sha256sum.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Binaries-${{ github.run_number }}
          path: |
            Image.gz
            dtbs
            build.config
            sha256sum.txt

      - name: Build AnyKernel3 zip
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/Image.gz ak3/dtb
          cp Image.gz ak3/
          cp dtbs/*.dtb ak3/ || true

          # 写入odin专用AK3脚本，不修改wifi/firmware分区
          cat > ak3/anykernel.sh <<'EOF'
#!/sbin/sh
# AnyKernel3 Odin (MIX4)
. /tmp/anykernel/tools/ak3-core.sh
dump_boot
write_boot
EOF

          # embed ksud
          if [ "${{ inputs.embed_ksud }}" = "true" ]; then
            cd ak3
            curl -L -o ksud https://github.com/5ec1cff/FinaSU/releases/download/${{ inputs.ksu_ref }}/ksud
            chmod +x ksud
          fi

          cd ak3
          zip -r9 ../Odin-FinaSU-SUSFS-${{ github.run_number }}.zip * -x .git README.md
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: odin-test-${{ github.run_number }}
          name: Odin FinaSU+SUSFS Build #${{ github.run_number }}
          prerelease: true
          files: |
            Odin-FinaSU-SUSFS-${{ github.run_number }}.zip
          body: |
            Build Info
            - Device: odin (Mi Mix4)
            - FinaSU: ${{ inputs.ksu_ref }}
            - SUSFS: ${{ inputs.disable_susfs == 'false' && 'Enabled' || 'Disabled' }}
            - Preinit: ${{ inputs.disable_preinit == 'false' && 'Enabled' || 'Disabled' }}
            - embed ksud: ${{ inputs.embed_ksud }}
            ✅ FIX: Removed venus defconfig migration
            ✅ FIX: Removed dangerous sched/input-boost patches
            ✅ FIX: Disabled SUSFS utsname/proc.version spoof (WiFi HAL crash fix)
            ⚠️ TEST BUILD, BACKUP BOOT BEFORE FLASH
            ⚠️ Must use FinaSU manager, not original KernelSU
